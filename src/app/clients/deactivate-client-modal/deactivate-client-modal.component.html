<app-modal [isOpen]="true" [showCloseButton]="false" (close)="cancel()" className="max-w-lg">
  <div class="p-5 sm:p-6">

    <!-- Header -->
    <div class="flex items-start justify-between mb-4">
      <h2 class="text-lg sm:text-xl font-semibold text-slate-900">Deactivate Client</h2>
      <button (click)="cancel()" type="button" aria-label="Close" class="shrink-0 -mt-1 -mr-1 p-1.5 rounded-md text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>

    <!-- Warning notice -->
    <div class="mb-4">
      <div class="flex gap-3">
        <div class="shrink-0 flex items-center justify-center w-8 h-8 rounded-full bg-amber-100">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5 text-amber-500" viewBox="0 0 20 20" fill="currentColor" style="width:18px;height:18px;">
            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l6.518 11.598c.75 1.334-.213 2.987-1.743 2.987H3.482c-1.53 0-2.493-1.653-1.743-2.987L8.257 3.1zM11 14a1 1 0 11-2 0 1 1 0 012 0zm-.25-6.5a.75.75 0 00-1.5 0v3.5a.75.75 0 001.5 0v-3.5z" clip-rule="evenodd" />
          </svg>
        </div>
        <div>
          <p class="text-sm font-semibold text-slate-900">Are you sure you want to deactivate this client?</p>
          <p class="mt-1 text-sm text-slate-500 leading-relaxed">
            {{ client()?.name }} ({{ client()?.code }}) will be deactivated. The client data will be retained but the client will no longer be active and cannot be used in new jobs.
          </p>
        </div>
      </div>
    </div>

    <!-- Form -->
    <div class="space-y-4">
      <div>
        <label for="reason" class="block text-sm font-semibold text-slate-900 mb-1.5">
          Reason for deactivation <span class="text-red-500">*</span>
        </label>
        <app-rich-select [options]="reasons" [(value)]="selectedReason" placeholder="Select a reason" class="w-full"></app-rich-select>
      </div>

      <div>
        <label for="notes" class="block text-sm font-semibold text-slate-900 mb-1.5">
          Additional notes (optional)
        </label>
        <textarea id="notes" rows="3" [(ngModel)]="additionalNote" placeholder="Enter any additional notes ..." class="w-full resize-none rounded-lg border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-300"></textarea>
      </div>
    </div>

    <!-- Status message -->
    @if (statusMessage) {
      <div class="flex items-start gap-2.5 rounded-xl p-3.5 mb-4"
           [class.bg-green-50]="statusType === 'success'"
           [class.border]="statusType === 'success'"
           [class.border-green-100]="statusType === 'success'"
           [class.bg-red-50]="statusType === 'error'"
           [class.border]="statusType === 'error'"
           [class.border-red-100]="statusType === 'error'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="mt-0.5 shrink-0"
             [class.text-green-500]="statusType === 'success'"
             [class.text-red-500]="statusType === 'error'">
          @if (statusType === 'success') {
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>
          } @else {
            <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>
          }
        </svg>
        <p class="text-sm font-medium"
           [class.text-green-700]="statusType === 'success'"
           [class.text-red-700]="statusType === 'error'">{{ statusMessage }}</p>
      </div>
    }

    <!-- Footer -->
    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 mt-4 pt-4 border-t border-slate-200">
      <button (click)="cancel()" [disabled]="submitting && statusType !== 'error'" type="button" class="w-full sm:w-auto px-5 py-2.5 rounded-lg border border-slate-200 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors disabled:opacity-70">
        Cancel
      </button>
      <button (click)="confirm()" [disabled]="!canSubmit() || submitting" type="button" class="w-full sm:w-auto px-5 py-2.5 rounded-lg bg-red-500 text-sm font-semibold text-white hover:bg-red-600 transition-colors shadow-sm disabled:opacity-70">
        <span *ngIf="!submitting">Deactivate Client</span>
        <span *ngIf="submitting">Deactivating...</span>
      </button>
    </div>

  </div>
</app-modal>
