<div class="relative bg-[#fafbfc] z-1 dark:bg-gray-900 sm:p-0">
  <div class="grid w-full lg:grid-cols-[360px_1fr] dark:bg-gray-900 min-h-screen">

    <!-- LEFT PANEL -->
    <div class="hidden lg:block h-screen sticky top-0 bg-[#0a1128]">
      <div class="flex flex-col px-8 sm:px-12 pt-10 pb-10 items-center justify-center h-full">
        <ng-content select="[layout-left]"></ng-content>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="flex flex-col w-full h-screen overflow-y-auto">
      <ng-content select="[layout-right]"></ng-content>
    </div>
    <app-toast></app-toast>

  </div>
</div>
