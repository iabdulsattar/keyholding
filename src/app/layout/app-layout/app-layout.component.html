<div class="min-h-screen lg:flex overflow-x-hidden">
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
    <div [class]="containerClasses$ | async" class="flex flex-col h-screen overflow-hidden">
      <div *ngIf="isTrialBannerVisible" class="bg-gradient-to-r from-amber-500 to-orange-500 text-white px-4 py-2 text-sm flex items-center justify-center">
        <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>You are on a free trial. Your trial expires in {{ trialDaysRemaining }} day{{ trialDaysRemaining === 1 ? '' : 's' }}.</span>
        <a routerLink="/subscription-plan" class="ml-4 font-semibold underline hover:no-underline">Upgrade now</a>
      </div>
      <div class="flex-1 overflow-y-auto bg-[#F4F6FA] p-6 max-w-full dark:bg-gray-950">
      <router-outlet></router-outlet>
    </div>
    <app-toast></app-toast>
  </div>
  <button (click)="toggleSidebar()" class="lg:hidden fixed bottom-4 right-4 z-50 flex items-center justify-center bg-blue-600 text-white rounded-full shadow-xl w-10 h-10 cursor-pointer hover:bg-blue-700 transition"
    [class.hidden]="isMobileOpen$ | async">
    <span class="relative w-5 h-5">
      <svg class="absolute inset-0 w-5 h-5 transition-all duration-300 ease-in-out"
           [class.opacity-100]="!(isMobileOpen$ | async)"
           [class.opacity-0]="isMobileOpen$ | async"
           [class.rotate-0]="!(isMobileOpen$ | async)"
           [class.-rotate-90]="isMobileOpen$ | async"
           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6H20M4 12H20M4 18H20"/>
      </svg>
      <svg class="absolute inset-0 w-5 h-5 transition-all duration-300 ease-in-out"
           [class.opacity-0]="!(isMobileOpen$ | async)"
           [class.opacity-100]="isMobileOpen$ | async"
           [class.rotate-90]="!(isMobileOpen$ | async)"
           [class.rotate-0]="isMobileOpen$ | async"
           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </span>
  </button>
</div>
