<aside
  id="sidebar"
  class="fixed inset-y-0 left-0 z-50 w-72 bg-[#0a1330] text-slate-300 flex flex-col justify-between transition-transform duration-300 ease-in-out -translate-x-full lg:translate-x-0 lg:static lg:min-h-screen lg:z-auto"
  [ngClass]="{ 'translate-x-0': isMobileOpen$ | async }"
>
  <div class="flex-grow overflow-y-auto scrollbar-none px-4 sm:px-6 py-6 space-y-6">
    <div class="flex items-center gap-3">
      <div class="h-11 w-11 shrink-0 rounded-xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center">
        <svg class="w-6 h-6 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 15l-4-4 1.41-1.41L11 13.17l5.59-5.59L18 9l-7 7z"/>
        </svg>
      </div>
      <div>
        <div class="text-white font-bold text-lg leading-tight">KeyVault <span class="text-blue-500">Pro</span></div>
        <div class="text-slate-400 text-xs">Enterprise Key Management</div>
      </div>
    </div>

    <div class="mt-6">
      <p class="text-[10px] uppercase font-bold tracking-widest text-slate-500 block mb-1">Current Company</p>
      <div class="flex items-center justify-between bg-white/5 border border-white/10 rounded-xl p-2.5">
        <div class="flex items-center gap-2.5 truncate">
          <div class="bg-blue-600/20 text-blue-400 p-1.5 rounded-lg">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 12h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><path d="M6 12h12"/>
            </svg>
          </div>
          <div class="truncate">
            <p class="text-sm font-semibold text-white truncate">{{ companyName }}</p>
            <p class="text-[10px] text-slate-400 truncate">Key Holding & Security</p>
          </div>
        </div>
        <svg class="w-3.5 h-3.5 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>

    <nav class="space-y-1">
      @for (item of navItems; track item.name) {
        @if (isNavVisible(item)) {
          <a [routerLink]="item.path"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition"
            [class.bg-blue-600/90]="isActive(item.path || '')"
            [class.text-white]="isActive(item.path || '')"
            [class.text-slate-300]="!isActive(item.path || '')"
            [class.hover:bg-white/5]="!isActive(item.path || '')"
            [class.hover:text-white]="!isActive(item.path || '')"
          >
            <span [innerHTML]="item.icon" class="w-5 h-5 shrink-0"></span>
            <span>{{ item.name }}</span>
          </a>
        }
      }
    </nav>
  </div>

  <div class="p-4 border-t border-white/10 bg-[#050f1d]">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm shrink-0">{{ userInitials }}</div>
      <div class="truncate">
        <h4 class="text-sm font-bold text-white truncate">{{ userName }}</h4>
        <p class="text-xs text-slate-400 truncate">{{ userRole || 'User' }}</p>
      </div>
    </div>
  </div>
</aside>
