<app-modal [isOpen]="true" [showCloseButton]="false" (close)="close.emit()" className="max-w-sm">
  <div class="p-6 sm:p-8 relative">
    <div class="flex items-start justify-between mb-5">
      <h2 class="text-xl font-bold text-slate-900">{{ title() }}</h2>
      <button (click)="close.emit()" class="text-slate-400 hover:text-slate-600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div class="flex items-center gap-3 mb-5">
      @if (icon()) {
        <div class="flex h-9 w-9 items-center justify-center rounded-full border-2 border-orange-400 shrink-0" [innerHTML]="icon()"></div>
      }
      <p class="text-[15px] font-semibold text-slate-900">{{ message() }}</p>
    </div>

    @if (errorMessage()) {
      <div class="flex items-start gap-2.5 rounded-xl p-3.5 mb-5 bg-red-50 border border-red-100">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 shrink-0 text-red-500">
          <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <p class="text-sm font-medium text-red-700">{{ errorMessage() }}</p>
      </div>
    }

    <div class="flex justify-end gap-3">
      <button (click)="close.emit()" [disabled]="submitting()" class="px-5 py-2.5 rounded-lg border border-slate-200 text-slate-700 font-semibold text-sm hover:bg-slate-50 disabled:opacity-70">
        {{ cancelText() }}
      </button>
      <button (click)="confirmed.emit()" [disabled]="submitting()" [class]="'flex items-center gap-2 px-5 py-2.5 rounded-lg text-white font-semibold text-sm disabled:opacity-70 ' + confirmClass()">
        @if (submitting()) {
          <span>Processing...</span>
        } @else {
          <span>{{ confirmText() }}</span>
        }
      </button>
    </div>
  </div>
</app-modal>
